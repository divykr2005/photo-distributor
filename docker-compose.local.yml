version: '3.8'

services:
  frontend:
    image: node:20-alpine
    container_name: photo_distr_frontend_local
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Cache node_modules so it doesn't reinstall every time
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: >
      sh -c "npm install && npm run dev"

volumes:
  frontend_node_modules:
