x-base: &base
  image: photo-distr-backend:latest
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: .env
  working_dir: /app
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-base-env: &base-env
  PYTHONPATH: /app
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  MALLOC_ARENA_MAX: "2"

services:
  # One-shot migrations; everything else waits for a clean exit.
  migrate:
    <<: *base
    container_name: photo_distr_migrate
    restart: "no"
    environment: *base-env
    command: alembic upgrade head
    mem_limit: 512m
    memswap_limit: 512m

  backend:
    <<: *base
    container_name: photo_distr_backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *base-env
    ports:
      - "127.0.0.1:8000:8000"   # Caddy is the only ingress
    command: >
      uvicorn main:app
      --host 0.0.0.0 --port 8000
      --workers 1
      --proxy-headers --forwarded-allow-ips='*'
      --timeout-keep-alive 65
      --limit-concurrency 128
      --no-access-log
    mem_limit: 768m
    memswap_limit: 1024m
    cpu_shares: 1024
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  worker-faces:
    <<: *base
    container_name: photo_distr_worker_faces
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *base-env
      INSIGHTFACE_MODEL: buffalo_l
      INSIGHTFACE_DET_SIZE: "640"
      INSIGHTFACE_HOME: /models
    volumes:
      - insightface_models:/models
    command: >
      celery -A core.celery_app.celery_app worker
      --loglevel=info
      --pool=prefork
      --concurrency=1
      --prefetch-multiplier=1
      --max-tasks-per-child=100
      --max-memory-per-child=1750000
      --without-gossip --without-mingle --without-heartbeat
      -Q faces
      -n faces@%h
    mem_limit: 2500m
    memswap_limit: 2500m
    mem_swappiness: 0
    cpu_shares: 256
    oom_score_adj: 600        # host OOM killer picks this before sshd/Caddy

  # match + zip + beat in a single interpreter, threaded (both are I/O-bound).
  worker-io:
    <<: *base
    container_name: photo_distr_worker_io
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *base-env
    volumes:
      - celerybeat:/var/lib/celerybeat
      - zip_staging:/var/tmp/zips     # disk, NOT tmpfs
    command: >
      celery -A core.celery_app.celery_app worker
      --loglevel=info
      --pool=threads
      --concurrency=4
      --prefetch-multiplier=1
      --without-gossip --without-mingle --without-heartbeat
      -Q match,celery,maintenance
      -n io@%h
      --beat --schedule=/var/lib/celerybeat/schedule
    mem_limit: 640m
    memswap_limit: 896m
    cpu_shares: 512
    oom_score_adj: 300

  # docker compose --profile debug up -d flower
  flower:
    <<: *base
    container_name: photo_distr_flower
    profiles: ["debug"]
    environment: *base-env
    command: celery -A core.celery_app.celery_app flower --port=5555
    ports:
      - "127.0.0.1:5555:5555"
    mem_limit: 256m

volumes:
  insightface_models:
  celerybeat:
  zip_staging:
